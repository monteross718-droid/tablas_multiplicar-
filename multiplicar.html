<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3 | Erik Monteros</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <header class="barra">
            <span class="marca">EM<span class="punto">.</span></span>
            <button type="button" class="boton" onclick="generarTablas()">PROBAR</button>

    <div class="campo">
        <label for="txtNumero">Número de la tabla</label>
        <input
            type="text"
            id="txtNumero"
            class="entrada"
            placeholder="Ejemplo: 3"
            inputmode="numeric"
            autocomplete="off"
    >   
    </div>

        <section class="tarjeta" aria-labelledby="titulo">
            <div class="encabezado">
                <span class="etiqueta">MATEMÁTICA · TABLAS</span>
                <h1 id="titulo">Tabla del <span>3</span></h1>
                <p>Una forma clara de aprender a multiplicar.</p>
            </div>

            <table>
                <thead>
                    <tr>
                        <th scope="col">Multiplicación</th>
                        <th scope="col">Resultado</th>
                    </tr>
                </thead>
                <tbody id="contenedorTabla"> 
                    <tr><td>3 × 1</td><td>3</td></tr>
                    <tr><td>3 × 2</td><td>6</td></tr>
                    <tr><td>3 × 3</td><td>9</td></tr>
                    <tr><td>3 × 4</td><td>12</td></tr>
                    <tr><td>3 × 5</td><td>15</td></tr>
                    <tr><td>3 × 6</td><td>18</td></tr>
                    <tr><td>3 × 7</td><td>21</td></tr>
                    <tr><td>3 × 8</td><td>24</td></tr>
                    <tr><td>3 × 9</td><td>27</td></tr>
                    <tr><td>3 × 10</td><td>30</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        ERIK SANTIAGO MONTEROS JARAMILLO
    </footer>
</body>
</html>
